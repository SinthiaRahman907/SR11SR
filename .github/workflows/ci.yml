name: CI

on: [push, pull_request]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t winddesk .
      - name: Start container
        run: docker run -d -p 8000:8000 --name winddesk winddesk
      - name: Smoke test
        run: |
          curl --retry 10 --retry-delay 3 --retry-all-errors -fsS http://localhost:8000/api/health
          curl -fsS http://localhost:8000/api/meta
          curl -fsS http://localhost:8000/ | grep -q WindDesk
      - name: Show logs on failure
        if: failure()
        run: docker logs winddesk
